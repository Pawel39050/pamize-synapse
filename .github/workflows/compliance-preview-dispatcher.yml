name: Compliance Guardian — Preview dispatcher
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  dispatch-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Dispatch ONLY dedicated feature-branch monitor
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method POST "repos/$REPOSITORY/actions/workflows/compliance-preview-monitor.yml/dispatches" \
            -f ref='feature/compliance-guardian'
          echo "Dispatched Preview workflow on feature/compliance-guardian."
          echo "This dispatcher does not read secrets or connect to a database."
