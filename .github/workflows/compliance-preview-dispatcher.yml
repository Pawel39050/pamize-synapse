name: Compliance Guardian — Preview dispatcher
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-preview-configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirm safe manual dispatcher
        shell: bash
        run: |
          set -euo pipefail
          echo "PASS: GitHub Actions manual dispatcher is available on default branch."
          echo "No secrets accessed. No HTTP calls. No database writes."
          echo "Preview monitor must remain separately authorized and tested."
