name: Compliance Guardian validation
on:
  push:
    branches:
      - feature/compliance-guardian
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compliance-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"
      VERCEL_ENV: "ci-validation"
      VERCEL_GIT_COMMIT_REF: "feature/compliance-guardian"
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Test and build without database secrets
        run: npm run build
